# CI: lint + tests on every push / pull request; the architecture decks must still build (no missing
# translations, figures computed from the reference PDFs). No secrets needed: tests make no LLM calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Tests (pytest)
        run: poetry run pytest -q

      - name: Architecture decks build
        run: poetry run python docs/architecture/build_decks.py
